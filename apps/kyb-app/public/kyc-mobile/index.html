<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0"
    />
    <meta name="theme-color" content="#1a1a2e" />
    <meta name="referrer" content="no-referrer" />
    <title>MiKashBoks – Identity Verification</title>
    <!-- Runtime config injected by entrypoint.sh (VITE_API_URL, etc.) -->
    <script type="text/javascript" src="/kyc-mobile/config.js"></script>
    <!-- Ballerine Web UI SDK (built from sdks/web-ui-sdk/) -->
    <script crossorigin src="/kyc-mobile/ballerine-sdk.umd.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      *,
      *::before,
      *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }

      html,
      body {
        height: 100%;
        font-family: 'Inter', -apple-system, sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }

      body {
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      #kyc-host {
        flex: 1;
        display: flex;
        flex-direction: column;
        overflow: hidden;
      }

      .init-message {
        text-align: center;
        padding: 40px 20px;
        line-height: 1.5;
      }

      .init-message.error {
        color: #ef4444;
      }

      .init-message.muted {
        color: #64748b;
      }

      .init-loading {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100%;
        gap: 16px;
      }

      .init-loading .spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e2e8f0;
        border-top-color: #4f46e5;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }

      .offline-banner {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: #ef4444;
        color: white;
        padding: 12px;
        text-align: center;
        z-index: 9999;
        font-size: 14px;
        font-weight: 500;
        display: none;
      }

      .offline-banner.visible {
        display: block;
      }
    </style>
  </head>
  <body>
    <div id="offline-banner" class="offline-banner" role="alert" aria-live="assertive">
      You are offline. Please check your internet connection.
    </div>
    <div id="kyc-host">
      <div class="init-loading">
        <div class="spinner"></div>
        <span style="color: #64748b; font-size: 14px">Starting verification...</span>
      </div>
    </div>

    <script>
      // ── Configuration ──
      var params = new URLSearchParams(window.location.search);
      var TOKEN = params.get('token') || '';
      var preselectedDocType = params.get('docType');

      // API base: from kyb-app runtime config (entrypoint.sh writes globalThis.env.VITE_API_URL)
      // Security: NEVER allow apiUrl override from query params (prevents credential theft)
      var rawBase =
        (typeof globalThis !== 'undefined' && globalThis.env && globalThis.env.VITE_API_URL) || '';
      var apiBase = rawBase.replace(/\/+$/, '');
      // If config.js didn't provide an absolute API URL, derive it from the current host.
      // The kyb-app runs on onboard.verify.X — the API runs on api.verify.X.
      if (!apiBase.startsWith('http')) {
        apiBase = window.location.origin.replace(/^(https?:\/\/)onboard\./, '$1api.') + '/api/v1';
        console.warn('VITE_API_URL not configured; derived API base from origin:', apiBase);
      }

      // ── Valid document types ──
      var VALID_DOC_TYPES = ['id_card', 'passport', 'voter_id', 'drivers_license'];
      var hasPreselectedDoc = VALID_DOC_TYPES.includes(preselectedDocType);

      // ── Document info for pre-selected type ──
      // When doc type is pre-selected from Android, the document-selection step is skipped.
      // We must set `type` and `documentInfo` on photo steps so the SDK knows which
      // document overlay to show and whether a back-side photo is needed.
      // Variant must match the SDK theme: passport = 'regular' (same as cards).
      // 'a4' is only for full-page documents (business registrations, etc.).
      var preselectedDocInfo = hasPreselectedDoc ? {
        type: preselectedDocType,
        kind: preselectedDocType,
        variant: 'regular',
        backSide: preselectedDocType !== 'passport',
        orderIndex: 0,
      } : null;

      // ── Build flow steps ──
      // Skip welcome + document-selection when doc type is pre-selected from Android
      var steps = [];
      if (!hasPreselectedDoc) {
        steps.push(
          { name: 'welcome', id: 'welcome' },
          {
            name: 'document-selection',
            id: 'document-selection',
            documentOptions: [
              { type: 'id_card', kind: 'id_card' },
              { type: 'passport', kind: 'passport' },
              { type: 'voter_id', kind: 'voter_id' },
              { type: 'drivers_license', kind: 'drivers_license' },
            ],
          },
        );
      }

      // Pass `type` and `documentInfo` on steps that need them when pre-selected.
      // `type` → used by getDocumentType() to resolve the document overlay.
      // `documentInfo` → used by CheckDocument/SelfieStart to determine back-side skipping,
      //   and by DocumentPhotoBackStart/CheckDocumentPhotoBack for document context.
      // When doc-selection is NOT skipped, the SDK populates selectedDocumentInfo store instead.
      steps.push(
        { name: 'document-photo', id: 'document-photo', type: hasPreselectedDoc ? preselectedDocType : undefined },
        { name: 'check-document', id: 'check-document', type: hasPreselectedDoc ? preselectedDocType : undefined, documentInfo: preselectedDocInfo },
        { name: 'document-photo-back-start', id: 'document-photo-back-start', documentInfo: preselectedDocInfo },
        { name: 'document-photo-back', id: 'document-photo-back', type: hasPreselectedDoc ? preselectedDocType : undefined },
        { name: 'check-document-photo-back', id: 'check-document-photo-back', documentInfo: preselectedDocInfo },
        { name: 'selfie-start', id: 'selfie-start', documentInfo: preselectedDocInfo },
        { name: 'selfie', id: 'selfie' },
        { name: 'check-selfie', id: 'check-selfie' },
        { name: 'loading', id: 'loading' },
        { name: 'resubmission', id: 'resubmission' },
        { name: 'decline', id: 'decline' },
        { name: 'final', id: 'final' },
      );

      // ── Signal completion to Android WebView ──
      // WebUrlLoaderFragment detects ?close=true and navigates to the final screen.
      function signalCompletion(status, idvResult) {
        var url = new URL('/kyc-mobile/done', window.location.origin);
        url.searchParams.set('close', 'true');
        url.searchParams.set('status', status);
        if (idvResult) url.searchParams.set('idvResult', idvResult);
        url.searchParams.set('sync', 'true');
        window.location.href = url.toString();
      }

      // ── Resubmission reason taxonomy ──
      // Maps server reason codes to user-facing messages (preserved from legacy implementation)
      var RESUBMISSION_REASONS = {
        DOCUMENT_BLURRY: 'Your document photo was blurry or unclear. Please retake it with better lighting and hold your phone steady.',
        DOCUMENT_OBSCURED: 'Part of your document was cut off or obscured. Make sure the entire document fits within the frame.',
        DOCUMENT_EXPIRED: 'The document you submitted has expired. Please use a valid, unexpired document.',
        FACE_NOT_VISIBLE: 'Your face was not clearly visible in the selfie. Please ensure good lighting and face the camera directly.',
        FACE_MISMATCH: 'The selfie does not match the face on your document. Please ensure you are submitting your own document.',
        DOCUMENT_BACK_MISSING: 'We need a photo of the back of your document. Please capture it.',
        DOCUMENT_TYPE_UNSUPPORTED: 'The document type you submitted is not accepted. Please choose a different document.',
        GENERIC: 'There was an issue with your submission. Please try again.',
      };

      // Map free-text revision reasons from Ballerine backoffice to structured codes
      function mapRevisionReasonToCode(revisionReason) {
        if (!revisionReason || typeof revisionReason !== 'string') return 'GENERIC';
        var lower = revisionReason.toLowerCase();
        if (/blur|unclear|quality|unreadable|sharp|focus/.test(lower)) return 'DOCUMENT_BLURRY';
        if (/obscur|cut off|partial|crop/.test(lower)) return 'DOCUMENT_OBSCURED';
        if (/expir/.test(lower)) return 'DOCUMENT_EXPIRED';
        if (/face not|selfie|face visible/.test(lower)) return 'FACE_NOT_VISIBLE';
        if (/face mismatch|does not match|face match/.test(lower)) return 'FACE_MISMATCH';
        if (/back|back side|reverse/.test(lower)) return 'DOCUMENT_BACK_MISSING';
        if (/unsupported|not accepted|wrong document/.test(lower)) return 'DOCUMENT_TYPE_UNSUPPORTED';
        return 'GENERIC';
      }

      // ── Main initialization ──
      async function initFlow() {
        // Check SDK availability — script may fail to load on slow networks
        if (typeof BallerineSDK === 'undefined') {
          document.getElementById('kyc-host').innerHTML =
            '<p class="init-message error">Verification SDK failed to load. Please check your internet connection and try again.</p>';
          return;
        }

        if (!TOKEN) {
          document.getElementById('kyc-host').innerHTML =
            '<p class="init-message muted">No verification token provided. Please open this page from the MiKashBoks app.</p>';
          return;
        }

        // 1. Fetch workflow data — BLOCKING: required for endUserId for uploads
        // Retry once (2 attempts total) with 20s timeout per attempt.
        // Mobile networks in Sierra Leone can be unreliable — a single attempt is insufficient.
        var FETCH_TIMEOUT_MS = 20000;
        var MAX_ATTEMPTS = 2;
        var workflowData = null;
        var lastFetchError = null;

        for (var attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
          try {
            var controller = new AbortController();
            var timeoutId = setTimeout(function () { controller.abort(); }, FETCH_TIMEOUT_MS);
            var resp = await fetch(apiBase + '/collection-flow/active-flow', {
              headers: { Authorization: 'Bearer ' + TOKEN },
              signal: controller.signal,
            });
            clearTimeout(timeoutId);
            if (!resp.ok) throw new Error('HTTP ' + resp.status);
            var json = await resp.json();
            workflowData = json.result || json;
            break; // success — exit retry loop
          } catch (e) {
            lastFetchError = e;
            console.warn('Workflow fetch attempt ' + attempt + '/' + MAX_ATTEMPTS + ' failed:', e);
            if (attempt < MAX_ATTEMPTS) {
              // Brief pause before retry (1s)
              await new Promise(function (r) { setTimeout(r, 1000); });
            }
          }
        }

        if (!workflowData) {
          console.error('Failed to load workflow after ' + MAX_ATTEMPTS + ' attempts:', lastFetchError);
          document.getElementById('kyc-host').innerHTML =
            '<p class="init-message error">Could not connect to the verification service. Please check your internet connection and try again.</p>';
          return;
        }

        var endUserId =
          workflowData?.endUserId || workflowData?.context?.entity?.id || 'unknown';
        var issuingCountry =
          workflowData?.context?.entity?.data?.country ||
          workflowData?.context?.customData?.country ||
          'SL';

        // 2. Check for resubmission state
        var resubmitReason = params.get('reason') || params.get('reasonCode');
        var workflowState = workflowData?.state || workflowData?.status;
        var isRevision = ['pending_resubmission', 'revision', 'revised'].includes(workflowState);

        // Detect revision reason from workflow context
        var detectedReasonCode = null;
        if (isRevision) {
          var docs = workflowData?.context?.documents || [];
          for (var i = 0; i < docs.length; i++) {
            var decision = docs[i].decision || {};
            if (decision.status === 'revision' && decision.revisionReason) {
              detectedReasonCode = mapRevisionReasonToCode(decision.revisionReason);
              break;
            }
          }
          if (!detectedReasonCode && workflowData?.context?.revisionReason) {
            detectedReasonCode = mapRevisionReasonToCode(workflowData.context.revisionReason);
          }
          if (!detectedReasonCode) {
            detectedReasonCode = 'GENERIC';
          }
        }

        // Use URL param reason if present
        var reasonCode =
          resubmitReason && RESUBMISSION_REASONS[resubmitReason]
            ? resubmitReason
            : detectedReasonCode;

        // 3. Initialize Ballerine SDK
        var sdkConfig = {
          endUserInfo: {
            id: endUserId,
            endUserMetadata: {
              issuingCountry: issuingCountry,
              // Only pass the minimal context fields needed by the SDK's final-submission.
              // The SDK spreads this into the COLLECTION_FLOW_FINISHED payload context.
              // Passing the entire workflow context is wasteful (can be 100KB+) and fragile.
              workflowContext: JSON.stringify({
                collectionFlow: (workflowData?.context || {}).collectionFlow || {},
              }),
              preselectedDocType: preselectedDocType || '',
            },
          },
          backendConfig: {
            baseUrl: apiBase,
            auth: {
              method: 'jwt',
              authorizationHeader: 'Bearer ' + TOKEN,
            },
            endpoints: {
              uploadFile: '/collection-flow/documents',
              updateContext: '/collection-flow/sync/context',
              finalSubmission: '/collection-flow/final-submission',
              sendEvent: '/collection-flow/send-event',
              activeFlow: '/collection-flow/active-flow',
            },
          },
          uiConfig: {
            general: {
              progress: true,
              colors: {
                primary: '#4f46e5',
              },
              fonts: {
                name: 'Inter',
                link: 'https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap',
                weight: [400, 500, 600, 700],
              },
            },
            flows: {
              'mikashboks-kyc': {
                steps: steps,
                syncFlow: true,
                useFinalQueryParams: true,
                showCloseButton: false,
              },
            },
          },
          translations: {
            overrides: {
              en: {
                welcome: {
                  title: 'Verify Your Identity',
                  description:
                    'Complete this quick verification to unlock loans, higher savings limits, and faster transactions.',
                  button: 'Get Started',
                },
                'document-selection': {
                  title: 'Choose Your Document',
                  description: 'Select the type of identity document you would like to use.',
                },
                // ── Capture-step translations ──
                // The SDK resolves document-photo / document-photo-back with nested
                // doc-type keys: e.g. t('document-photo.id_card', 'title').
                'document-photo': {
                  title: 'Take Document Photo',
                  description: 'Position the front of your document inside the frame. Ensure good lighting and no glare.',
                  id_card:          { title: 'National ID – Front',    description: 'Position the front of your National ID inside the frame.' },
                  passport:         { title: 'Passport Photo Page',    description: 'Position the photo page of your passport inside the frame.' },
                  voter_id:         { title: 'Voter ID – Front',       description: 'Position the front of your Voter ID inside the frame.' },
                  drivers_license:  { title: "Driver's Licence – Front", description: "Position the front of your Driver's Licence inside the frame." },
                },
                'check-document': {
                  title: 'Check Your Photo',
                  description: 'Make sure all text is clear and readable, with no blur or glare.',
                },
                'document-photo-back-start': {
                  title: 'Back of Document',
                  description: 'Now take a photo of the back of your document.',
                  button: 'Take Photo',
                },
                'document-photo-back': {
                  title: 'Document – Back Side',
                  description: 'Position the back of your document inside the frame.',
                  id_card:          { title: 'National ID – Back',     description: 'Position the back of your National ID inside the frame.' },
                  voter_id:         { title: 'Voter ID – Back',        description: 'Position the back of your Voter ID inside the frame.' },
                  drivers_license:  { title: "Driver's Licence – Back",description: "Position the back of your Driver's Licence inside the frame." },
                },
                'check-document-photo-back': {
                  title: 'Check Back Photo',
                  description: 'Make sure the back side is clear and readable.',
                },
                'selfie-start': {
                  title: 'Take a Selfie',
                  description: 'Position your face inside the oval and ensure good lighting.',
                  button: 'Take Selfie',
                },
                selfie: {
                  title: 'Selfie',
                  description: 'Look straight at the camera. Make sure your face is fully visible.',
                },
                'check-selfie': {
                  title: 'Check Your Selfie',
                  description: 'Make sure your face is clearly visible and well-lit.',
                },
                // ── End-state translations ──
                loader: {
                  'text-one': 'Uploading photos...',
                  'text-two': 'Processing verification...',
                  'text-three': 'Manual review may be needed...',
                },
                final: {
                  title: 'Verification Complete',
                  description:
                    'Your documents have been submitted successfully. You can now close this page.',
                  button: 'Done',
                },
                resubmission: {
                  title: 'Resubmission Required',
                  description: reasonCode
                    ? RESUBMISSION_REASONS[reasonCode] || RESUBMISSION_REASONS.GENERIC
                    : 'There was an issue with your submission. Please try again.',
                  button: 'Try Again',
                },
                decline: {
                  title: 'Verification Could Not Be Completed',
                  description: 'Please contact support for assistance.',
                },
                // ── General / shared strings ──
                general: {
                  errorDocumentVerification: 'Verification check failed. Retrying...',
                  errorDocuments: 'Failed to upload documents. Please try again.',
                },
              },
            },
          },
        };

        await BallerineSDK.flows.init(sdkConfig);

        BallerineSDK.flows.mount({
          flowName: 'mikashboks-kyc',
          elementId: 'kyc-host',
          jwt: TOKEN,
          callbacks: {
            onFlowComplete: function (payload) {
              var idvResult = payload && payload.payload ? payload.payload.idvResult : '';
              if (idvResult === 'declined') {
                signalCompletion('error', idvResult);
              } else if (idvResult === 'resubmission_requested') {
                signalCompletion('resubmit', idvResult);
              } else {
                signalCompletion('success', idvResult || 'approved');
              }
            },
            onFlowExit: function () {
              signalCompletion('exit', '');
            },
            onFlowError: function (error) {
              console.error('Flow error:', error);
              signalCompletion('error', '');
            },
          },
        });
      }

      // ── Start ──
      initFlow().catch(function (err) {
        console.error('Init failed:', err);
        document.getElementById('kyc-host').innerHTML =
          '<p class="init-message error">Could not start verification. Please close and try again.</p>';
      });

      // ── Offline detection ──
      var offlineBanner = document.getElementById('offline-banner');
      window.addEventListener('offline', function () {
        offlineBanner.classList.add('visible');
      });
      window.addEventListener('online', function () {
        offlineBanner.classList.remove('visible');
      });
    </script>
  </body>
</html>

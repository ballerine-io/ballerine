<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0" />
  <meta name="theme-color" content="#1a1a2e" />
  <meta name="referrer" content="no-referrer" />
  <title>MiKashBoks – Identity Verification</title>
  <!-- Runtime config injected by entrypoint.sh (VITE_API_URL, etc.) -->
  <script type="text/javascript" src="/kyc-mobile/config.js"></script>
  <!-- MiKashBoks Web UI SDK runtime -->
  <script crossorigin src="/kyc-mobile/ballerine-sdk.umd.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <!-- Lottie animation library (lightweight ~50KB) — falls back to CSS spinner if CDN fails -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/lottie-web/5.12.2/lottie.min.js" crossorigin="anonymous"
    defer></script>
  <style>
    *,
    *::before,
    *::after {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      height: 100%;
      width: 100%;
      max-width: 100%;
      font-family: 'Inter', -apple-system, sans-serif;
      background: #f8fafc;
      color: #1e293b;
    }

    body {
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #kyc-host {
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      width: 100%;
    }

    .init-message {
      text-align: center;
      padding: 40px 20px;
      font-size: 16px;
      line-height: 1.6;
    }

    .init-message.error {
      color: #ef4444;
    }

    .init-message.muted {
      color: #64748b;
    }

    .init-loading {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      gap: 16px;
    }

    .init-loading .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid #cbd5e1;
      border-top-color: #0071d3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .offline-banner {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      background: #ef4444;
      color: white;
      padding: 12px;
      text-align: center;
      z-index: 9999;
      font-size: 14px;
      font-weight: 500;
      display: none;
    }

    .offline-banner.visible {
      display: block;
    }

    body.native-header .offline-banner {
      top: env(safe-area-inset-top);
    }

    .status-wrap {
      height: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .status-card {
      width: min(92vw, 520px);
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 18px;
      padding: 22px;
      box-shadow: 0 10px 32px rgba(15, 23, 42, 0.08);
    }

    .status-title {
      font-size: 26px;
      font-weight: 700;
      color: #0f172a;
      margin-bottom: 12px;
    }

    .status-body {
      font-size: 18px;
      line-height: 1.65;
      color: #475569;
      margin-bottom: 16px;
    }

    .status-meta {
      font-size: 15px;
      color: #64748b;
      margin-top: 14px;
      line-height: 1.5;
    }

    .status-diagnostics {
      margin-top: 12px;
      padding: 10px 12px;
      border-radius: 10px;
      border: 1px dashed #cbd5e1;
      background: #f8fafc;
      color: #334155;
      font-size: 12px;
      line-height: 1.45;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
    }

    .status-next-steps {
      background: #f1f5f9;
      border-radius: 12px;
      padding: 14px 16px;
      margin-top: 14px;
      font-size: 15px;
      line-height: 1.5;
      color: #334155;
    }

    .status-next-steps strong {
      display: block;
      font-weight: 600;
      margin-bottom: 4px;
      color: #0f172a;
    }

    .status-actions {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    .status-btn {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 16px 18px;
      font-size: 17px;
      font-weight: 600;
      cursor: pointer;
    }

    .status-btn.primary {
      background: #0071d3;
      color: #ffffff;
    }

    .status-btn.secondary {
      background: #e2e8f0;
      color: #0f172a;
    }

    body.native-header {
      padding-top: env(safe-area-inset-top);
    }

    body.native-header #kyc-host {
      border-radius: 0;
    }

    body.hide-sdk-header #kyc-host #blrn-app [class*='flow-header'],
    body.hide-sdk-header #kyc-host #blrn-app [class*='FlowHeader'],
    body.hide-sdk-header #kyc-host #blrn-app [class*='navigation-header'],
    body.hide-sdk-header #kyc-host #blrn-app [class*='NavigationHeader'] {
      display: none !important;
    }

    body.large-type #kyc-host #blrn-app {
      font-size: 18px !important;
      line-height: 1.65 !important;
    }

    body.large-type #kyc-host #blrn-app [class*='title'],
    body.large-type #kyc-host #blrn-app .title,
    body.large-type #kyc-host #blrn-app [class*='Title'] {
      font-size: 28px !important;
    }

    body.large-type #kyc-host #blrn-app [class*='description'],
    body.large-type #kyc-host #blrn-app .description,
    body.large-type #kyc-host #blrn-app [class*='body'],
    body.large-type #kyc-host #blrn-app .body,
    body.large-type #kyc-host #blrn-app [class*='text'] {
      font-size: 20px !important;
    }

    .status-spinner {
      width: 22px;
      height: 22px;
      border: 3px solid #cbd5e1;
      border-top-color: #0071d3;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      display: inline-block;
      vertical-align: -5px;
      margin-right: 10px;
    }

    /* Use more of the viewport on preview/check steps while keeping proportions. */
    body.large-type #kyc-host #blrn-app img[alt='result'] {
      width: min(98vw, 600px) !important;
      max-height: 80vh !important;
      object-fit: contain !important;
    }

    body.large-type #kyc-host #blrn-app .overlay.card {
      width: min(96vw, 560px) !important;
      max-height: 92vh !important;
    }

    body.large-type #kyc-host #blrn-app .overlay.passport {
      width: min(90vw, 460px) !important;
      max-height: 92vh !important;
    }

    body.large-type #kyc-host #blrn-app .overlay.selfie {
      width: min(92vw, 460px) !important;
      max-height: 94vh !important;
    }

    /* ── Landscape orientation hint ── */
    .orientation-hint {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background: rgba(15, 23, 42, 0.92);
      z-index: 9998;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 16px;
      color: #fff;
      font-size: 18px;
      font-weight: 500;
      text-align: center;
      padding: 24px;
    }

    .orientation-hint.visible {
      display: flex;
    }

    .orientation-hint .rotate-icon {
      width: 64px;
      height: 64px;
      animation: rotateHint 2s ease-in-out infinite;
    }

    @keyframes rotateHint {

      0%,
      100% {
        transform: rotate(0deg);
      }

      50% {
        transform: rotate(90deg);
      }
    }

    .orientation-hint .dismiss-btn {
      margin-top: 12px;
      padding: 10px 24px;
      border: 1px solid rgba(255, 255, 255, 0.4);
      border-radius: 8px;
      background: transparent;
      color: #fff;
      font-size: 14px;
      cursor: pointer;
    }

    /* ── Enhanced touch targets for SL mobile users ── */
    body.large-type #kyc-host #blrn-app button,
    body.large-type #kyc-host #blrn-app [role='button'] {
      min-height: 48px !important;
      min-width: 48px !important;
    }

    body.large-type #kyc-host #blrn-app button:not([class*='icon']):not([class*='close']):not([class*='back']) {
      padding: 16px 24px !important;
      font-size: 18px !important;
    }

    /* ── Progress bar enhancement ── */
    #kyc-host #blrn-app [class*='progress-bar'],
    #kyc-host #blrn-app [class*='ProgressBar'] {
      height: 6px !important;
      border-radius: 3px !important;
      background: #e2e8f0 !important;
      overflow: hidden !important;
      transition: all 0.4s ease !important;
    }

    #kyc-host #blrn-app [class*='progress-bar']>div,
    #kyc-host #blrn-app [class*='ProgressBar']>div {
      background: linear-gradient(90deg, #094275, #0071d3) !important;
      border-radius: 3px !important;
      transition: width 0.4s ease !important;
    }

    /* ── Status card icon ── */
    .status-icon {
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 16px;
    }

    .status-icon svg {
      width: 56px;
      height: 56px;
    }

    /* ── Smooth step transitions ── */
    #kyc-host #blrn-app>div {
      animation: stepFadeIn 0.3s ease-out;
    }

    @keyframes stepFadeIn {
      from {
        opacity: 0;
        transform: translateY(8px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* ── Lottie loading container ── */
    .lottie-loading-wrap {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }

    .lottie-loading-wrap .lottie-player {
      width: 120px;
      height: 120px;
    }

    .b-kyc-client .welcome-wrapper {
      padding-bottom: 30px !important;
      margin-bottom: 20px !important;
    }

    /* Hide init spinner when Lottie takes over */
    .init-loading.has-lottie .spinner {
      display: none;
    }

    /* ── Landscape document overlay enhancement ── */
    @media (orientation: landscape) {
      #kyc-host #blrn-app .overlay.card {
        width: min(80vh, 520px) !important;
        height: min(50vh, 340px) !important;
      }
    }
  </style>
</head>

<body>
  <div id="offline-banner" class="offline-banner" role="alert" aria-live="assertive">
    You are offline. Please check your internet connection.
  </div>
  <div id="orientation-hint" class="orientation-hint" role="dialog" aria-label="Rotate your phone">
    <svg class="rotate-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none" stroke="currentColor"
      stroke-width="2">
      <rect x="16" y="8" width="32" height="48" rx="4" />
      <line x1="28" y1="50" x2="36" y2="50" />
      <path d="M52 20l8 8l-8 8" stroke-width="2.5" />
      <path d="M48 28h12" stroke-width="2.5" />
    </svg>
    <div>Rotate your phone for<br />the best document photo</div>
    <button class="dismiss-btn" type="button">Continue in portrait</button>
  </div>
  <div id="kyc-host">
    <div class="init-loading">
      <div class="spinner"></div>
      <span style="color: #64748b; font-size: 14px">Starting verification...</span>
    </div>
  </div>

  <script>
    // ── Configuration ──
    var params = new URLSearchParams(window.location.search);
    var TOKEN = params.get('token') || '';
    function normalizeDocType(docType) {
      if (!docType) return null;
      var normalized = String(docType)
        .trim()
        .toLowerCase()
        .replace(/[\s-]+/g, '_');
      // Map Android enum names and common variants to SDK-expected types
      if (
        normalized === 'national_id' ||
        normalized === 'sierraleone_national_id'
      ) {
        return 'id_card';
      }
      if (
        normalized === 'sierraleone_voter_id' ||
        normalized === 'voter'
      ) {
        return 'voter_id';
      }
      if (
        normalized === 'driver_license' ||
        normalized === 'driver_licence' ||
        normalized === 'drivers_licence' ||
        normalized === 'sierraleone_driver_license'
      ) {
        return 'drivers_license';
      }
      if (
        normalized === 'sierraleone_passport'
      ) {
        return 'passport';
      }
      // Canonical SDK types — pass through without warning (normal case from backend)
      if (
        normalized === 'id_card' ||
        normalized === 'passport' ||
        normalized === 'voter_id' ||
        normalized === 'drivers_license'
      ) {
        return normalized;
      }
      // Unknown type — log for observability but pass through.
      // normalizeDocOptions() also calls this function, so returning null here would
      // silently drop valid server-provided document options. The VALID_DOC_TYPES
      // guard (below) handles unknown URL ?docType params separately.
      console.warn('[KYC] normalizeDocType: unrecognized type:', normalized,
        '— passing through as-is.');
      return normalized;
    }

    function normalizeDocOptions(docOptions) {
      if (!Array.isArray(docOptions)) return [];
      var normalizedOptions = [];
      for (var i = 0; i < docOptions.length; i++) {
        var option = docOptions[i];
        if (!option || typeof option !== 'object') continue;
        var normalizedType = normalizeDocType(option.type);
        if (!normalizedType) continue;
        normalizedOptions.push(
          Object.assign({}, option, {
            type: normalizedType,
          }),
        );
      }
      return normalizedOptions;
    }

    var preselectedDocType = normalizeDocType(params.get('docType'));
    var initRetryAttempted = false;
    var initFailed = false;
    var legacyFallbackAttempted = params.get('legacy') === '1';
    function parseBoolFlag(value) {
      if (!value) return false;
      var normalized = String(value).trim().toLowerCase();
      return normalized === '1' || normalized === 'true';
    }
    var skipWelcomeFromQuery = parseBoolFlag(params.get('skipWelcome'));
    var hasNativeHeader = parseBoolFlag(params.get('nativeHeader'));
    var addressProofFromQuery = parseBoolFlag(params.get('addressProof'));
    if (hasNativeHeader && document.body) {
      document.body.classList.add('native-header');
    }

    var defaultUiFlags = {
      enableLargeTypography: true,
      simplifyCopy: true,
      hideWebHeaderInNative: true,
      skipWelcomeWhenNativeIntro: true,
      showCompatTriggerReason: true,
      showHardFailDiagnostics: true,
      requireAddressProof: false,
      forceLegacyWhenAddressProof: false,
      enableLegacyFallbackOnInit: false,
    };
    var runtimeUiFlags = Object.assign({}, defaultUiFlags);

    function parseOptionalBool(value, fallbackValue) {
      if (typeof value === 'boolean') return value;
      if (typeof value === 'number') return value !== 0;
      if (typeof value === 'string') {
        if (parseBoolFlag(value)) return true;
        if (value.trim().toLowerCase() === 'false' || value.trim() === '0') return false;
      }
      return fallbackValue;
    }

    function resolveUiFlags(rawUiFlags) {
      var raw = rawUiFlags && typeof rawUiFlags === 'object' ? rawUiFlags : {};
      return {
        enableLargeTypography: parseOptionalBool(
          raw.enableLargeTypography,
          defaultUiFlags.enableLargeTypography,
        ),
        simplifyCopy: parseOptionalBool(raw.simplifyCopy, defaultUiFlags.simplifyCopy),
        hideWebHeaderInNative: parseOptionalBool(
          raw.hideWebHeaderInNative,
          defaultUiFlags.hideWebHeaderInNative,
        ),
        skipWelcomeWhenNativeIntro: parseOptionalBool(
          raw.skipWelcomeWhenNativeIntro,
          defaultUiFlags.skipWelcomeWhenNativeIntro,
        ),
        showCompatTriggerReason: parseOptionalBool(
          raw.showCompatTriggerReason,
          defaultUiFlags.showCompatTriggerReason,
        ),
        showHardFailDiagnostics: parseOptionalBool(
          raw.showHardFailDiagnostics,
          defaultUiFlags.showHardFailDiagnostics,
        ),
        requireAddressProof: parseOptionalBool(
          raw.requireAddressProof,
          addressProofFromQuery || defaultUiFlags.requireAddressProof,
        ),
        forceLegacyWhenAddressProof: parseOptionalBool(
          raw.forceLegacyWhenAddressProof,
          addressProofFromQuery || defaultUiFlags.forceLegacyWhenAddressProof,
        ),
        enableLegacyFallbackOnInit: parseOptionalBool(
          raw.enableLegacyFallbackOnInit,
          defaultUiFlags.enableLegacyFallbackOnInit,
        ),
      };
    }

    function applyUiFlagClasses(uiFlags) {
      if (!document.body) return;
      document.body.classList.toggle('large-type', Boolean(uiFlags.enableLargeTypography));
      document.body.classList.toggle(
        'hide-sdk-header',
        Boolean(hasNativeHeader && uiFlags.hideWebHeaderInNative),
      );
    }

    applyUiFlagClasses(runtimeUiFlags);

    function buildLegacyFallbackUrl(reason, options) {
      var opts = options || {};
      var legacyParams = new URLSearchParams(window.location.search);
      legacyParams.set('legacy', '1');
      legacyParams.set('cb', String(Date.now()));
      if (reason) legacyParams.set('legacyReason', reason);
      if (opts.addressProof) legacyParams.set('addressProof', '1');
      legacyParams.set('showCompatReason', runtimeUiFlags.showCompatTriggerReason ? '1' : '0');
      return '/kyc-mobile-legacy/?' + legacyParams.toString();
    }

    function normalizeLegacyReason(err) {
      return String((err && err.message) || err || 'init_error')
        .replace(/[^a-zA-Z0-9_.:-]/g, '_')
        .slice(0, 64);
    }

    function describeLegacyReason(reasonCode) {
      var reason = String(reasonCode || '').toLowerCase();
      if (reason.indexOf('timeout') !== -1 || reason.indexOf('network') !== -1) {
        return 'Your connection was unstable while loading the verification interface.';
      }
      if (
        reason.indexOf('invalid_step') !== -1 ||
        reason.indexOf('unknown_step') !== -1 ||
        reason.indexOf('step') !== -1
      ) {
        return 'Your phone had trouble loading one verification screen in the standard flow.';
      }
      if (reason.indexOf('address_proof_required') !== -1) {
        return 'This verification requires one extra address document.';
      }
      if (reason.indexOf('sdk') !== -1 || reason.indexOf('init') !== -1) {
        return 'Your phone could not start the full verification interface.';
      }
      return 'Your phone is switching to a simpler verification mode for better compatibility.';
    }

    function tryLegacyFallback(err, options) {
      if (legacyFallbackAttempted) return false;
      legacyFallbackAttempted = true;
      var reason = normalizeLegacyReason(err);
      var reasonDescription = describeLegacyReason(reason);
      var opts = options || {};
      console.warn(
        '[KYC] ⚠ LEGACY FALLBACK TRIGGERED — reason:',
        reason,
        '| addressProof:',
        !!opts.addressProof,
        '| token:',
        TOKEN ? TOKEN.slice(0, 8) + '...' : 'none',
        '| url:',
        window.location.href,
      );
      renderStatusCard({
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#3b82f6" opacity="0.12"/><circle cx="28" cy="28" r="20" fill="#3b82f6"/><path d="M28 16v24M16 28h24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
        title: opts.addressProof ? 'Preparing Address Verification' : (runtimeUiFlags.simplifyCopy ? 'One Moment' : 'Opening Safe Mode'),
        body: runtimeUiFlags.showCompatTriggerReason
          ? reasonDescription
          : (runtimeUiFlags.simplifyCopy ? 'Preparing a simpler version of the verification process.' : 'Opening a compatibility mode that works better on some phones.'),
        meta: runtimeUiFlags.simplifyCopy ? 'This usually takes a few seconds.' : 'Compatibility mode usually opens within 10 seconds.',
        showSpinner: true,
        primaryLabel: 'Please wait...',
      });
      setTimeout(function () {
        window.location.replace(buildLegacyFallbackUrl(reason, opts));
      }, 250);
      return true;
    }

    function shouldUseLegacyFallback(err) {
      if (!runtimeUiFlags.enableLegacyFallbackOnInit) return false;
      var reason = normalizeLegacyReason(err).toLowerCase();
      if (
        reason.indexOf('timeout') !== -1 ||
        reason.indexOf('network') !== -1 ||
        reason.indexOf('request_failed') !== -1 ||
        reason.indexOf('http_') !== -1 ||
        reason.indexOf('401') !== -1 ||
        reason.indexOf('403') !== -1 ||
        reason.indexOf('404') !== -1 ||
        reason.indexOf('409') !== -1 ||
        reason.indexOf('500') !== -1
      ) {
        return false;
      }
      return (
        reason.indexOf('classlist') !== -1 ||
        reason.indexOf('listprops') !== -1 ||
        reason.indexOf('invalid_step') !== -1 ||
        reason.indexOf('unknown_step') !== -1 ||
        reason.indexOf('sdk') !== -1 ||
        reason.indexOf('init') !== -1
      );
    }

    // API base: from kyb-app runtime config (entrypoint.sh writes globalThis.env.VITE_API_URL)
    // Security: NEVER allow apiUrl override from query params (prevents credential theft)
    var rawBase =
      (typeof globalThis !== 'undefined' && globalThis.env && globalThis.env.VITE_API_URL) || '';
    var apiBase = rawBase.replace(/\/+$/, '');
    // If config.js didn't provide an absolute API URL, derive it from the current host.
    // The kyb-app runs on onboard.verify.X — the API runs on api.verify.X.
    if (!apiBase.startsWith('http')) {
      apiBase = window.location.origin.replace(/^(https?:\/\/)onboard\./, '$1api.') + '/api/v1';
      console.warn('VITE_API_URL not configured; derived API base from origin:', apiBase);
    }

    // ── Default document options (SL fallback) ──
    // When the workflow config provides kycSdkDocumentOptions, those take
    // precedence.  Otherwise we use these hardcoded SL defaults.
    var DEFAULT_DOC_OPTIONS = normalizeDocOptions([
      { type: 'id_card', kind: 'proof_of_identity', variant: 'regular', backSide: true },
      { type: 'passport', kind: 'proof_of_identity', variant: 'regular', backSide: false },
      { type: 'voter_id', kind: 'proof_of_identity', variant: 'regular', backSide: true },
      { type: 'drivers_license', kind: 'proof_of_identity', variant: 'regular', backSide: true },
    ]);
    var VALID_DOC_TYPES = DEFAULT_DOC_OPTIONS.map(function (d) {
      return d.type;
    });
    // Extra validation: even if normalizeDocType returned a value, reject it if
    // it's not in our known document options to prevent SDK init crash.
    if (preselectedDocType && !VALID_DOC_TYPES.includes(preselectedDocType)) {
      console.warn('[KYC] preselectedDocType', preselectedDocType,
        'is not in VALID_DOC_TYPES', VALID_DOC_TYPES, '— clearing preselection.');
      preselectedDocType = null;
    }
    var hasPreselectedDoc = VALID_DOC_TYPES.includes(preselectedDocType);

    // ── Document info for pre-selected type ──
    // Resolved after workflow fetch so config.kycSdkDocumentOptions can drive it.
    // Initialised here from defaults; overwritten in initFlow() if config provides data.
    var preselectedDocInfo = null;
    function resolvePreselectedDocInfo(docOptions) {
      if (!hasPreselectedDoc) return null;
      var match = null;
      for (var i = 0; i < docOptions.length; i++) {
        if (docOptions[i].type === preselectedDocType) {
          match = docOptions[i];
          break;
        }
      }
      if (!match) return null;
      return {
        type: match.type,
        kind: match.kind || 'proof_of_identity',
        variant: match.variant || 'regular',
        backSide: match.backSide !== false,
        orderIndex: 0,
      };
    }
    // Default until workflow fetch overrides
    preselectedDocInfo = resolvePreselectedDocInfo(DEFAULT_DOC_OPTIONS);

    function shouldSkipWelcomeStep() {
      return skipWelcomeFromQuery && runtimeUiFlags.skipWelcomeWhenNativeIntro;
    }

    function shouldHideSdkStepHeader() {
      return hasNativeHeader && runtimeUiFlags.hideWebHeaderInNative;
    }

    function applyStepUiOverrides(step) {
      if (!step || !shouldHideSdkStepHeader()) return step;
      if (['document-photo', 'document-photo-back', 'selfie'].includes(step.name)) {
        step.elements = [
          { id: 'title', disabled: true },
          { id: 'description', disabled: true },
        ];
      }
      return step;
    }

    // ── Build flow steps ──
    // Skip welcome + document-selection when doc type is pre-selected from Android
    function buildSteps(usePreselectedDoc) {
      var builtSteps = [];
      if (!usePreselectedDoc) {
        if (!shouldSkipWelcomeStep()) {
          builtSteps.push({
            name: 'welcome',
            id: 'welcome',
            elements: [{ id: 'list', type: 'list', orderIndex: 45, props: {} }],
          });
        }
        builtSteps.push({
          name: 'document-selection',
          id: 'document-selection',
          documentOptions: [
            { type: 'id_card', kind: 'proof_of_identity' },
            { type: 'passport', kind: 'proof_of_identity' },
            { type: 'voter_id', kind: 'proof_of_identity' },
            { type: 'drivers_license', kind: 'proof_of_identity' },
          ],
        });
      }

      // Pass `type` and `documentInfo` on steps that need them when pre-selected.
      // `type` → used by getDocumentType() to resolve the document overlay.
      // `documentInfo` → used by CheckDocument/SelfieStart to determine back-side skipping,
      //   and by DocumentPhotoBackStart/CheckDocumentPhotoBack for document context.
      // When doc-selection is NOT skipped, the SDK populates selectedDocumentInfo store instead.
      builtSteps.push(
        {
          name: 'document-photo',
          id: 'document-photo',
          type: usePreselectedDoc ? preselectedDocType : undefined,
        },
        {
          name: 'check-document',
          id: 'check-document',
          type: usePreselectedDoc ? preselectedDocType : undefined,
          documentInfo: preselectedDocInfo,
        },
        {
          name: 'document-photo-back-start',
          id: 'document-photo-back-start',
          documentInfo: preselectedDocInfo,
        },
        {
          name: 'document-photo-back',
          id: 'document-photo-back',
          type: usePreselectedDoc ? preselectedDocType : undefined,
        },
        {
          name: 'check-document-photo-back',
          id: 'check-document-photo-back',
          documentInfo: preselectedDocInfo,
        },
        { name: 'selfie-start', id: 'selfie-start', documentInfo: preselectedDocInfo },
        { name: 'selfie', id: 'selfie' },
        { name: 'check-selfie', id: 'check-selfie' },
      );

      // Address proof steps — added conditionally when the workflow requires it.
      // These reuse the SDK's DocumentPhotoBackStart, DocumentPhoto, and CheckDocument
      // components with a 'proof_of_address' document kind.
      if (runtimeUiFlags.requireAddressProof) {
        builtSteps.push(
          {
            name: 'address-proof-start',
            id: 'address-proof-start',
          },
          {
            name: 'address-proof-photo',
            id: 'address-proof-photo',
            type: 'utility_bill',
            documentInfo: {
              type: 'utility_bill',
              kind: 'proof_of_address',
              variant: 'regular',
              backSide: false,
              orderIndex: 10,
            },
          },
          {
            name: 'check-address-proof',
            id: 'check-address-proof',
            type: 'utility_bill',
            documentInfo: {
              type: 'utility_bill',
              kind: 'proof_of_address',
              variant: 'regular',
              backSide: false,
              orderIndex: 10,
            },
          },
        );
      }

      builtSteps.push(
        { name: 'loading', id: 'loading' },
        { name: 'resubmission', id: 'resubmission' },
        { name: 'decline', id: 'decline' },
        { name: 'manual-review', id: 'manual-review' },
        { name: 'error', id: 'error' },
        { name: 'final', id: 'final' },
      );
      return builtSteps.map(applyStepUiOverrides);
    }

    // ── Server-driven step builder ──
    // Maps config.kycSdkSteps (an array of SDK step name strings) from the
    // workflow config to SDK step objects.  This is distinct from
    // collectionFlow.state.steps which contains form-page names
    // (personal_information, kyc_documents, etc.) — a different namespace.
    // Falls back to buildSteps() when the config provides no step data.
    // docOptions: config.kycSdkDocumentOptions (or DEFAULT_DOC_OPTIONS fallback).
    //   Drives the document-selection step's selectable types.
    function buildStepsFromConfig(stepNames, usePreselectedDoc, docOptions) {
      var selectionOptions = (docOptions || DEFAULT_DOC_OPTIONS).map(function (d) {
        return { type: d.type, kind: d.kind || 'proof_of_identity' };
      });

      return stepNames.map(function (name) {
        var step = { name: name, id: name };

        // Enrich steps that need extra SDK props — mirrors buildSteps() enrichment
        if (name === 'welcome') {
          step.elements = [{ id: 'list', type: 'list', orderIndex: 45, props: {} }];
        }
        if (name === 'document-selection') {
          step.documentOptions = selectionOptions;
        }
        if (['document-photo', 'check-document', 'document-photo-back'].includes(name)) {
          if (usePreselectedDoc) step.type = preselectedDocType;
        }
        if (
          [
            'check-document',
            'document-photo-back-start',
            'check-document-photo-back',
            'selfie-start',
          ].includes(name)
        ) {
          step.documentInfo = preselectedDocInfo;
        }
        // Address proof steps — set type and documentInfo for proof_of_address category
        if (['address-proof-photo', 'check-address-proof'].includes(name)) {
          step.type = 'utility_bill';
          step.documentInfo = {
            type: 'utility_bill',
            kind: 'proof_of_address',
            variant: 'regular',
            backSide: false,
            orderIndex: 10,
          };
        }
        return applyStepUiOverrides(step);
      });
    }

    // NOTE: `steps` is resolved after the workflow fetch (see below) so we can
    // prefer config-driven steps from workflowData.config.kycSdkSteps.

    // ── Signal completion to Android WebView ──
    // WebUrlLoaderFragment detects ?close=true and navigates to the final screen.
    var signalSent = false;
    function signalCompletion(status, idvResult, reasonCode) {
      if (signalSent) return;
      signalSent = true;
      // Clean up observers and animations before navigating away
      if (typeof cleanupObserversAndAnimations === 'function') {
        cleanupObserversAndAnimations();
      }
      var url = new URL('/kyc-mobile/done', window.location.origin);
      url.searchParams.set('close', 'true');
      url.searchParams.set('status', status);
      if (idvResult) url.searchParams.set('idvResult', idvResult);
      if (reasonCode) url.searchParams.set('reasonCode', reasonCode);
      url.searchParams.set('sync', 'true');
      window.location.href = url.toString();
    }

    function escapeHtml(input) {
      return String(input || '').replace(/[&<>"']/g, function (ch) {
        return (
          {
            '&': '&amp;',
            '<': '&lt;',
            '>': '&gt;',
            '"': '&quot;',
            "'": '&#39;',
          }[ch] || ch
        );
      });
    }

    function setHostHtml(html) {
      var host = document.getElementById('kyc-host');
      if (host) host.innerHTML = html;
    }

    function normalizeDiagnosticValue(value, fallback) {
      var normalized = String(value || '')
        .trim()
        .replace(/\s+/g, '_')
        .replace(/[^a-zA-Z0-9_.:-]/g, '_')
        .slice(0, 80);
      return normalized || fallback;
    }

    function extractHardFailDiagnostics(error, fallbackStage) {
      var source = error || {};
      var payload =
        source && source.payload && typeof source.payload === 'object' ? source.payload : {};
      var status = Number(source.status || payload.status || 0);
      var rawReasonCode =
        source.reasonCode ||
        payload.reasonCode ||
        payload.code ||
        (typeof source.code !== 'undefined' ? source.code : '');
      var message =
        source.message || payload.message || payload.detail || payload.error || 'Unknown failure';
      var reasonCode = rawReasonCode;
      if (!reasonCode) {
        var lowerMessage = String(message || '').toLowerCase();
        if (status === 409) {
          reasonCode = 'WORKFLOW_CONFLICT';
        } else if (lowerMessage.indexOf('timeout') !== -1) {
          reasonCode = 'NETWORK_TIMEOUT';
        } else if (
          lowerMessage.indexOf('network') !== -1 ||
          lowerMessage.indexOf('failed to fetch') !== -1
        ) {
          reasonCode = 'NETWORK_ERROR';
        } else if (status >= 500) {
          reasonCode = 'SERVER_ERROR';
        } else if (status === 401 || status === 403) {
          reasonCode = 'AUTH_ERROR';
        } else if (status > 0) {
          reasonCode = 'HTTP_' + status;
        } else {
          reasonCode = 'UNKNOWN_ERROR';
        }
      }
      var stage = source.stage || payload.stage || fallbackStage || 'unknown_stage';
      return {
        status: Number.isFinite(status) && status > 0 ? status : 0,
        stage: normalizeDiagnosticValue(stage, 'unknown_stage'),
        reasonCode: normalizeDiagnosticValue(reasonCode, 'unknown_reason'),
        message: String(message || 'Unknown failure'),
      };
    }

    function buildHardFailDiagnosticsText(diagnostics) {
      if (!runtimeUiFlags.showHardFailDiagnostics) return '';
      var parts = [];
      if (diagnostics.status) parts.push('http=' + diagnostics.status);
      parts.push('stage=' + diagnostics.stage);
      parts.push('reason=' + diagnostics.reasonCode);
      return 'Ref: ' + parts.join(' | ');
    }

    function isParentStateMismatchMessage(diagnostics) {
      var msg = String((diagnostics && diagnostics.message) || '').toLowerCase();
      return msg.indexOf('kyc_child_responded') !== -1 && msg.indexOf('idle') !== -1;
    }

    function getHardFailMetaMessage(diagnostics) {
      if (diagnostics.status === 409) {
        return runtimeUiFlags.simplifyCopy
          ? 'We are syncing your status. If this takes too long, tap Ask for Help in MiKashBoks.'
          : 'This request appears to be a duplicate submission. Refresh status to continue from the current workflow state. If needed, tap Ask for Help in MiKashBoks.';
      }
      return (
        'If this keeps happening, close and reopen the verification link from MiKashBoks. ' +
        'Then tap Ask for Help and share the Ref code with support.'
      );
    }

    function getHardFailBodyMessage(diagnostics, fallbackText) {
      var reason = String((diagnostics && diagnostics.reasonCode) || '').toUpperCase();
      if (
        diagnostics.status === 409 &&
        ['WORKFLOW_STATE_CONFLICT', 'WORKFLOW_CONFLICT', 'PARENT_WORKFLOW_STATE_IDLE'].includes(
          reason,
        )
      ) {
        return runtimeUiFlags.simplifyCopy
          ? 'We already received your details. Loading the next step...'
          : 'We already received this verification submission. Refresh to load your latest status.';
      }
      if (reason === 'DOCUMENT_ALREADY_EXISTS') {
        return 'This photo was already uploaded. Please continue.';
      }
      if (reason === 'DOCUMENT_VERSION_CONFLICT') {
        return 'A newer document version already exists. Refresh and continue.';
      }
      if (reason === 'NETWORK_TIMEOUT') {
        return 'The request timed out. Please try again on a stronger connection.';
      }
      if (reason === 'NETWORK_OFFLINE') {
        return 'You appear to be offline. Please reconnect and try again.';
      }
      if (reason === 'SUBMISSION_DISPATCH_FAILED') {
        return 'Your photos were uploaded, but processing did not start. Please try again.';
      }
      return fallbackText || 'Something went wrong. Please try again.';
    }

    function renderStatusCard(options) {
      var title = options && options.title ? String(options.title) : '';
      var body = options && options.body ? String(options.body) : '';
      var meta = options && options.meta ? String(options.meta) : '';
      var nextSteps = options && options.nextSteps ? String(options.nextSteps) : '';
      var diagnostics = options && options.diagnostics ? String(options.diagnostics) : '';
      var showSpinner = Boolean(options && options.showSpinner);
      var icon = options && options.icon ? String(options.icon) : '';

      var primaryLabel = options && options.primaryLabel ? String(options.primaryLabel) : 'Close';
      var secondaryLabel =
        options && options.secondaryLabel ? String(options.secondaryLabel) : '';

      setHostHtml(
        '<div class="status-wrap">' +
        '<div class="status-card">' +
        (icon ? '<div class="status-icon">' + icon + '</div>' : '') +
        '<div class="status-title">' +
        escapeHtml(title) +
        '</div>' +
        '<div class="status-body">' +
        (showSpinner ? '<span class="status-spinner"></span>' : '') +
        escapeHtml(body) +
        '</div>' +
        (meta ? '<div class="status-meta">' + escapeHtml(meta) + '</div>' : '') +
        (diagnostics
          ? '<div class="status-diagnostics">' + escapeHtml(diagnostics) + '</div>'
          : '') +
        (nextSteps
          ? '<div class="status-next-steps"><strong>What happens next?</strong>' +
          escapeHtml(nextSteps) +
          '</div>'
          : '') +
        '<div class="status-actions">' +
        (secondaryLabel
          ? '<button id="status-secondary" class="status-btn secondary" type="button">' +
          escapeHtml(secondaryLabel) +
          '</button>'
          : '') +
        '<button id="status-primary" class="status-btn primary" type="button">' +
        escapeHtml(primaryLabel) +
        '</button>' +
        '</div>' +
        '</div>' +
        '</div>',
      );

      var primaryBtn = document.getElementById('status-primary');
      if (primaryBtn && options && typeof options.onPrimary === 'function') {
        primaryBtn.addEventListener('click', options.onPrimary);
      }

      var secondaryBtn = document.getElementById('status-secondary');
      if (secondaryBtn && options && typeof options.onSecondary === 'function') {
        secondaryBtn.addEventListener('click', options.onSecondary);
      }
    }

    // ── Resubmission reason taxonomy ──
    // Maps server reason codes to user-facing messages (preserved from legacy implementation)
    var RESUBMISSION_REASONS = {
      DOCUMENT_BLURRY:
        'Your document photo was blurry or unclear. Please retake it with better lighting and hold your phone steady.',
      DOCUMENT_OBSCURED:
        'Part of your document was cut off or obscured. Make sure the entire document fits within the frame.',
      DOCUMENT_EXPIRED:
        'The document you submitted has expired. Please use a valid, unexpired document.',
      FACE_NOT_VISIBLE:
        'Your face was not clearly visible in the selfie. Please ensure good lighting and face the camera directly.',
      FACE_MISMATCH:
        'The selfie does not match the face on your document. Please ensure you are submitting your own document.',
      DOCUMENT_BACK_MISSING: 'We need a photo of the back of your document. Please capture it.',
      DOCUMENT_TYPE_UNSUPPORTED:
        'The document type you submitted is not accepted. Please choose a different document.',
      GENERIC: 'There was an issue with your submission. Please try again.',
    };

    // Map free-text revision reasons from MiKashBoks backoffice to structured codes
    function mapRevisionReasonToCode(revisionReason) {
      if (!revisionReason || typeof revisionReason !== 'string') return 'GENERIC';
      var lower = revisionReason.toLowerCase();
      if (/blur|unclear|quality|unreadable|sharp|focus/.test(lower)) return 'DOCUMENT_BLURRY';
      if (/obscur|cut off|partial|crop/.test(lower)) return 'DOCUMENT_OBSCURED';
      if (/expir/.test(lower)) return 'DOCUMENT_EXPIRED';
      if (/face not|selfie|face visible/.test(lower)) return 'FACE_NOT_VISIBLE';
      if (/face mismatch|does not match|face match/.test(lower)) return 'FACE_MISMATCH';
      if (/back|back side|reverse/.test(lower)) return 'DOCUMENT_BACK_MISSING';
      if (/unsupported|not accepted|wrong document/.test(lower))
        return 'DOCUMENT_TYPE_UNSUPPORTED';
      return 'GENERIC';
    }

    function safeJsonClone(value, fallback) {
      try {
        if (value == null) return fallback;
        return JSON.parse(JSON.stringify(value));
      } catch (e) {
        console.warn('Failed to clone JSON payload:', e);
        return fallback;
      }
    }

    function buildWorkflowContextForSubmission(activeFlow) {
      var context = safeJsonClone(activeFlow && activeFlow.context, {}) || {};
      var activeState = safeJsonClone(activeFlow && activeFlow.state, null);

      if (!context.collectionFlow || typeof context.collectionFlow !== 'object') {
        context.collectionFlow = {};
      }

      // Prefer the computed state from /active-flow (contains canonical step tuple).
      if (activeState && Array.isArray(activeState.steps) && activeState.steps.length > 0) {
        context.collectionFlow.state = activeState;
      }

      return context;
    }

    function normalizeWorkflowState(value) {
      return String(value || '')
        .trim()
        .toLowerCase();
    }

    function extractRevisionReasonCodeFromWorkflow(workflowData) {
      var context = workflowData && typeof workflowData.context === 'object' ? workflowData.context : {};
      var contextResult =
        context && context.result && typeof context.result === 'object' ? context.result : {};
      var directReasonCode =
        context.reasonCode ||
        contextResult.reasonCode ||
        (workflowData && workflowData.reasonCode ? workflowData.reasonCode : '');
      if (directReasonCode) {
        return String(directReasonCode);
      }
      if (typeof context.revisionReason === 'string' && context.revisionReason.trim()) {
        return mapRevisionReasonToCode(context.revisionReason);
      }
      var docs = Array.isArray(context.documents) ? context.documents : [];
      for (var i = 0; i < docs.length; i++) {
        var decision = docs[i] && docs[i].decision ? docs[i].decision : null;
        if (!decision || typeof decision !== 'object') continue;
        var decisionResult =
          decision.result && typeof decision.result === 'object' ? decision.result : {};
        var decisionReason = decision.reasonCode || decisionResult.reasonCode;
        if (decisionReason) {
          return String(decisionReason);
        }
        if (decision.status === 'revision' && typeof decision.revisionReason === 'string') {
          return mapRevisionReasonToCode(decision.revisionReason);
        }
      }
      return 'GENERIC';
    }

    function isIdempotentWorkflowConflictDiagnostics(diagnostics) {
      var reason = String((diagnostics && diagnostics.reasonCode) || '').toUpperCase();
      return (
        diagnostics &&
        diagnostics.status === 409 &&
        ['WORKFLOW_STATE_CONFLICT', 'WORKFLOW_CONFLICT', 'PARENT_WORKFLOW_STATE_IDLE'].includes(
          reason,
        )
      );
    }

    async function fetchLatestWorkflowForConflictReconcile() {
      var fetchOptions = { headers: { Authorization: 'Bearer ' + TOKEN } };
      var timeoutMs = 15000;
      var timeoutPromise = new Promise(function (_, reject) {
        setTimeout(function () {
          reject(new Error('Timeout'));
        }, timeoutMs);
      });
      var abortTimeout = null;
      if (typeof AbortController !== 'undefined') {
        var controller = new AbortController();
        fetchOptions.signal = controller.signal;
        abortTimeout = setTimeout(function () {
          controller.abort();
        }, timeoutMs);
      }
      var resp = await Promise.race([
        fetch(apiBase + '/collection-flow/active-flow', fetchOptions),
        timeoutPromise,
      ]);
      if (abortTimeout) clearTimeout(abortTimeout);
      if (!resp.ok) throw new Error('HTTP ' + resp.status);
      var json = await resp.json();
      return json && json.result ? json.result : json;
    }

    async function reconcileConflictAndComplete(diagnostics) {
      console.warn('[KYC] Reconciling idempotent conflict', diagnostics);
      renderStatusCard({
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#3b82f6" opacity="0.12"/><circle cx="28" cy="28" r="20" fill="#3b82f6"/><path d="M28 16v24M16 28h24" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
        title: 'Syncing Verification Status',
        body: 'We already received your submission. Updating your status now.',
        meta: 'This usually takes a few seconds.',
        showSpinner: true,
        primaryLabel: 'Please wait...',
      });

      try {
        var latestFlow = await fetchLatestWorkflowForConflictReconcile();
        var workflowState = normalizeWorkflowState(latestFlow && (latestFlow.state || latestFlow.status));
        var reasonCode = extractRevisionReasonCodeFromWorkflow(latestFlow);
        var approvedStates = ['approved', 'auto_approved'];
        var rejectedStates = ['rejected', 'auto_rejected', 'declined'];
        var reviewStates = ['manual_review', 'review'];
        var revisionStates = ['pending_resubmission', 'revision', 'revised'];
        var processingStates = [
          'idle',
          'document_collection',
          'pending_kyc',
          'kyc_verification',
          'kyb_determination',
          'document_verification',
          'facial_verification',
          'dedup_evaluation',
          'device_dedup_check',
          'ncra_check',
          'risk_evaluation',
          'awaiting_3rd_party_data',
        ];

        if (approvedStates.includes(workflowState)) {
          signalCompletion('success', 'approved', reasonCode);
          return;
        }
        if (rejectedStates.includes(workflowState)) {
          signalCompletion('error', 'rejected', reasonCode);
          return;
        }
        if (revisionStates.includes(workflowState)) {
          signalCompletion('resubmit', 'resubmission_requested', reasonCode);
          return;
        }
        if (reviewStates.includes(workflowState)) {
          signalCompletion('exit', 'manual_review', reasonCode);
          return;
        }
        if (processingStates.includes(workflowState)) {
          signalCompletion('exit', 'processing', reasonCode);
          return;
        }

        console.warn('[KYC] Conflict reconciliation landed in unknown state', {
          workflowState: workflowState,
          diagnostics: diagnostics,
        });
        signalCompletion('exit', 'processing', reasonCode || diagnostics.reasonCode);
      } catch (reconcileError) {
        var reconcileDiagnostics = extractHardFailDiagnostics(reconcileError, 'conflict_reconcile');
        console.error('[KYC] Conflict reconciliation failed', reconcileError, reconcileDiagnostics);
        renderStatusCard({
          icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#ef4444" opacity="0.12"/><circle cx="28" cy="28" r="20" fill="#ef4444"/><path d="M28 18v12M28 34v2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
          title: 'Status Sync Delayed',
          body: 'We received your submission, but could not refresh your latest status yet.',
          meta: 'Tap Refresh Status to try again. You can safely close this screen.',
          diagnostics: buildHardFailDiagnosticsText(reconcileDiagnostics),
          primaryLabel: 'Refresh Status',
          secondaryLabel: 'Close',
          onPrimary: function () {
            window.location.reload();
          },
          onSecondary: function () {
            signalCompletion('exit', 'processing', diagnostics.reasonCode || 'WORKFLOW_CONFLICT');
          },
        });
      }
    }

    // ── Init status helper ──
    function setInitStatus(msg) {
      var span = document.querySelector('.init-loading span');
      if (span) span.textContent = msg;
    }

    // ── Camera permission pre-check ──
    async function checkCameraPermission() {
      try {
        if (navigator.permissions && navigator.permissions.query) {
          var result = await navigator.permissions.query({ name: 'camera' });
          if (result.state === 'denied') {
            renderStatusCard({
              icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#f59e0b" opacity="0.12"/><circle cx="28" cy="28" r="20" fill="#f59e0b"/><path d="M28 18v12M28 34v2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
              title: 'Camera Access Required',
              body: 'Please enable camera access in your phone settings, then return to this page.',
              primaryLabel: 'Retry',
              onPrimary: function () {
                window.location.reload();
              },
            });
            return false;
          }
        }
      } catch (e) {
        /* not all browsers support permissions.query for camera */
      }
      return true;
    }

    // ── Main initialization ──
    async function initFlow() {
      // Check SDK availability — script may fail to load on slow networks
      var MiKashBoksSDK = window.BallerineSDK;

      if (typeof MiKashBoksSDK === 'undefined') {
        document.getElementById('kyc-host').innerHTML =
          '<p class="init-message error">Verification SDK failed to load. Please check your internet connection and try again.</p>';
        return;
      }

      if (!TOKEN) {
        document.getElementById('kyc-host').innerHTML =
          '<p class="init-message muted">No verification token provided. Please open this page from the MiKashBoks app.</p>';
        return;
      }

      var cameraOk = await checkCameraPermission();
      if (!cameraOk) return;

      // 1. Fetch workflow data — BLOCKING: required for endUserId for uploads
      // Retry once (2 attempts total) with 20s timeout per attempt.
      // Mobile networks in Sierra Leone can be unreliable — a single attempt is insufficient.
      var FETCH_TIMEOUT_MS = 20000;
      var MAX_ATTEMPTS = 2;
      var workflowData = null;
      var lastFetchError = null;

      setInitStatus('Connecting to verification service...');

      for (var attempt = 1; attempt <= MAX_ATTEMPTS; attempt++) {
        try {
          var fetchOptions = { headers: { Authorization: 'Bearer ' + TOKEN } };
          var timeoutPromise = new Promise(function (_, reject) {
            setTimeout(function () {
              reject(new Error('Timeout'));
            }, FETCH_TIMEOUT_MS);
          });
          var abortTimeout = null;
          if (typeof AbortController !== 'undefined') {
            var controller = new AbortController();
            fetchOptions.signal = controller.signal;
            abortTimeout = setTimeout(function () {
              controller.abort();
            }, FETCH_TIMEOUT_MS);
          }
          var resp = await Promise.race([
            fetch(apiBase + '/collection-flow/active-flow', fetchOptions),
            timeoutPromise,
          ]);
          if (abortTimeout) clearTimeout(abortTimeout);
          if (!resp.ok) throw new Error('HTTP ' + resp.status);
          var json = await resp.json();
          workflowData = json.result || json;
          break; // success — exit retry loop
        } catch (e) {
          lastFetchError = e;
          console.warn(
            '[KYC] Workflow fetch attempt ' + attempt + '/' + MAX_ATTEMPTS + ' failed:',
            (e && e.message) || 'Unknown error',
          );
          if (attempt < MAX_ATTEMPTS) {
            // Brief pause before retry (1s)
            await new Promise(function (r) {
              setTimeout(r, 1000);
            });
          }
        }
      }

      if (!workflowData) {
        var fetchDiagnostics = extractHardFailDiagnostics(lastFetchError, 'active_flow_fetch');
        console.error(
          '[KYC] Failed to load workflow after ' + MAX_ATTEMPTS + ' attempts:',
          (lastFetchError && lastFetchError.message) || 'Unknown error',
        );

      // 5. Initialize MiKashBoks SDK
      var workflowContextPayload = buildWorkflowContextForSubmission(workflowData);
      var workflowStatePayload = safeJsonClone(workflowData && workflowData.state, {});

      var sdkConfig = {

      await MiKashBoksSDK.flows.init(sdkConfig);

      MiKashBoksSDK.flows.mount({
        flowName: 'mikashboks-kyc',
        elementId: 'kyc-host',
        jwt: TOKEN,
        callbacks: {
          onFlowComplete: function (payload) {
            var idvResult = payload && payload.payload ? payload.payload.idvResult : '';

            renderStatusCard({

                  : 'We could not complete verification on this attempt. Please try again.',
              ),
              meta: getHardFailMetaMessage(diagnostics),
              diagnostics: buildHardFailDiagnosticsText(diagnostics),
              primaryLabel: diagnostics.status === 409 ? 'Refresh Status' : 'Try Again',
              secondaryLabel: 'Close',
              onPrimary: function () {
                window.location.reload();
              },
              onSecondary: function () {
                if (diagnostics.status === 409) {
                  signalCompletion('exit', 'processing', diagnostics.reasonCode);
                  return;
                }
                signalCompletion('error', '', diagnostics.reasonCode || 'FLOW_ERROR');
              },
            });
          },
        },
      });
    }

    // ── Start ──
    initFlow().catch(async function (err) {
      var initDiagnostics = extractHardFailDiagnostics(err, 'sdk_init');
      console.error('[KYC] Init failed:', (err && err.message) || 'Unknown error');
      // Hardening: If preselected doc mode fails to boot (SDK/config edge case),
      // retry once in full-flow mode instead of failing immediately.
      if (!initRetryAttempted) {
        initRetryAttempted = true;
        hasPreselectedDoc = false;
        preselectedDocType = null;
        preselectedDocInfo = null;

        // ── Cleanup: destroy any partial SDK state from the failed first init ──
        // Without this, the second init() call hits stale DOM and crashes with
        // "Cannot read properties of undefined (reading 'classList')".
        try {
          var sdk = window.BallerineSDK;
          if (sdk && sdk.flows && typeof sdk.flows.destroy === 'function') {
            sdk.flows.destroy();
          }
        } catch (destroyErr) {
          console.warn('[KYC] SDK destroy before retry failed (non-fatal):', destroyErr);
        }
        // Reset the host container to a clean loading state
        var host = document.getElementById('kyc-host');
        if (host) {
          host.innerHTML =
            '<div class="init-loading">' +
            '<div class="spinner"></div>' +
            '<span style="color:#64748b;font-size:14px">Retrying verification...</span>' +
            '</div>';
        }
        // Brief pause to let the browser GC stale references
        await new Promise(function (r) {
          setTimeout(r, 300);
        });

        console.warn('Retrying KYC init in full-flow mode after bootstrap failure');
        try {
          await initFlow();
          return;
        } catch (retryErr) {
          console.error(
            '[KYC] Retry init failed:',
            (retryErr && retryErr.message) || 'Unknown error',
          );
          err = retryErr;
          initDiagnostics = extractHardFailDiagnostics(retryErr, 'sdk_init_retry');
        }
      }

      // Legacy fallback intentionally disabled for now.
      // We want SDK/bootstrap issues to fail on the primary page so we can fix root causes
      // instead of silently routing users to legacy mode.
      //
      // if (shouldUseLegacyFallback(err) && tryLegacyFallback(err)) {
      //   return;
      // }

      initFailed = true;
      renderStatusCard({
        icon: '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 56 56"><circle cx="28" cy="28" r="28" fill="#ef4444" opacity="0.12"/><circle cx="28" cy="28" r="20" fill="#ef4444"/><path d="M28 18v12M28 34v2" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round"/></svg>',
        title: 'Could Not Start Verification',
        body: 'Something went wrong while loading. Please check your internet connection and try again.',
        meta: getHardFailMetaMessage(initDiagnostics),
        diagnostics: buildHardFailDiagnosticsText(initDiagnostics),
        primaryLabel: 'Retry',
        secondaryLabel: 'Close',
        onPrimary: function () {
          window.location.reload();
        },
        onSecondary: function () {
          signalCompletion('error', '', initDiagnostics.reasonCode || 'INIT_FAILED');
        },
      });
    });

    // ── Lottie loading animation (for initial page load) ──
    var lottieAnimData = {
      v: '5.7.1',
      fr: 30,
      ip: 0,
      op: 60,
      w: 200,
      h: 200,
      nm: 'verify',
      layers: [
        {
          ddd: 0,
          ind: 0,
          ty: 4,
          nm: 'arc',
          sr: 1,
          ks: {
            o: { a: 0, k: 100 },
            r: {
              a: 1,
              k: [
                { i: { x: [0.833], y: [0.833] }, o: { x: [0.167], y: [0.167] }, t: 0, s: [0] },
                { t: 60, s: [360] },
              ],
            },
            p: { a: 0, k: [100, 100, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: { a: 0, k: [100, 100, 100] },
          },
          ao: 0,
          shapes: [
            { ty: 'el', d: 1, s: { a: 0, k: [140, 140] }, p: { a: 0, k: [0, 0] } },
            {
              ty: 'st',
              c: { a: 0, k: [0.0, 0.443, 0.827, 1] },
              o: { a: 0, k: 100 },
              w: { a: 0, k: 5 },
              lc: 2,
              lj: 1,
              d: [
                { n: 'd', nm: 'd', v: { a: 0, k: 90 } },
                { n: 'g', nm: 'g', v: { a: 0, k: 200 } },
              ],
            },
          ],
          ip: 0,
          op: 60,
          st: 0,
          bm: 0,
        },
        {
          ddd: 0,
          ind: 1,
          ty: 4,
          nm: 'arc2',
          sr: 1,
          ks: {
            o: { a: 0, k: 50 },
            r: {
              a: 1,
              k: [
                { i: { x: [0.833], y: [0.833] }, o: { x: [0.167], y: [0.167] }, t: 0, s: [180] },
                { t: 60, s: [540] },
              ],
            },
            p: { a: 0, k: [100, 100, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: { a: 0, k: [100, 100, 100] },
          },
          ao: 0,
          shapes: [
            { ty: 'el', d: 1, s: { a: 0, k: [110, 110] }, p: { a: 0, k: [0, 0] } },
            {
              ty: 'st',
              c: { a: 0, k: [0.0, 0.443, 0.827, 1] },
              o: { a: 0, k: 100 },
              w: { a: 0, k: 3 },
              lc: 2,
              lj: 1,
              d: [
                { n: 'd', nm: 'd', v: { a: 0, k: 50 } },
                { n: 'g', nm: 'g', v: { a: 0, k: 200 } },
              ],
            },
          ],
          ip: 0,
          op: 60,
          st: 0,
          bm: 0,
        },
        {
          ddd: 0,
          ind: 2,
          ty: 4,
          nm: 'pulse',
          sr: 1,
          ks: {
            o: {
              a: 1,
              k: [
                { i: { x: [0.667] }, o: { x: [0.333] }, t: 0, s: [20] },
                { i: { x: [0.667] }, o: { x: [0.333] }, t: 30, s: [8] },
                { t: 60, s: [20] },
              ],
            },
            r: { a: 0, k: 0 },
            p: { a: 0, k: [100, 100, 0] },
            a: { a: 0, k: [0, 0, 0] },
            s: {
              a: 1,
              k: [
                {
                  i: { x: [0.667, 0.667, 0.667] },
                  o: { x: [0.333, 0.333, 0.333] },
                  t: 0,
                  s: [100, 100, 100],
                },
                {
                  i: { x: [0.667, 0.667, 0.667] },
                  o: { x: [0.333, 0.333, 0.333] },
                  t: 30,
                  s: [115, 115, 100],
                },
                { t: 60, s: [100, 100, 100] },
              ],
            },
          },
          ao: 0,
          shapes: [
            { ty: 'el', d: 1, s: { a: 0, k: [70, 70] }, p: { a: 0, k: [0, 0] } },
            { ty: 'fl', c: { a: 0, k: [0.0, 0.443, 0.827, 1] }, o: { a: 0, k: 100 } },
          ],
          ip: 0,
          op: 60,
          st: 0,
          bm: 0,
        },
      ],
    };

    var lottieInstance = null;

    function destroyLottie() {
      if (lottieInstance) {
        try {
          lottieInstance.destroy();
        } catch (e) {
          /* ignore */
        }
        lottieInstance = null;
      }
    }

    function initLottieForInitLoading() {
      if (typeof window.lottie === 'undefined') return;
      var initLoadingEl = document.querySelector('.init-loading');
      if (!initLoadingEl) return;
      destroyLottie();
      var container = document.createElement('div');
      container.className = 'lottie-player';
      container.style.width = '120px';
      container.style.height = '120px';
      initLoadingEl.insertBefore(container, initLoadingEl.firstChild);
      try {
        lottieInstance = window.lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: lottieAnimData,
        });
        initLoadingEl.classList.add('has-lottie');
      } catch (e) {
        console.warn('Lottie init failed, keeping CSS spinner:', e);
      }
    }

    function tryInjectLottieIntoSDKLoader(blrnApp) {
      if (typeof window.lottie === 'undefined') return;
      if (blrnApp.querySelector('.lottie-player')) return;
      var spinnerEl = blrnApp.querySelector(
        '[class*="loader" i], [class*="spinner" i], [class*="loading" i]',
      );
      if (!spinnerEl || !spinnerEl.parentElement) return;
      destroyLottie();
      var container = document.createElement('div');
      container.className = 'lottie-player';
      container.style.width = '120px';
      container.style.height = '120px';
      container.style.margin = '0 auto 16px';
      spinnerEl.parentElement.insertBefore(container, spinnerEl);
      try {
        lottieInstance = window.lottie.loadAnimation({
          container: container,
          renderer: 'svg',
          loop: true,
          autoplay: true,
          animationData: lottieAnimData,
        });
        spinnerEl.style.display = 'none';
      } catch (e) {
        container.remove();
      }
    }

    // Initialize Lottie for the init loading spinner once script loads
    if (typeof window.lottie !== 'undefined') {
      initLottieForInitLoading();
    } else {
      // Wait for deferred lottie script to load
      window.addEventListener('load', function () {
        setTimeout(initLottieForInitLoading, 100);
      });
    }

    // ── Landscape orientation hint for document capture ──
    var orientationHint = document.getElementById('orientation-hint');
    var isDocCaptureActive = false;
    var orientationDismissed = false;
    var resizeDebounce = null;

    function showOrientationHint() {
      if (!isDocCaptureActive || orientationDismissed) return;
      if (window.innerHeight > window.innerWidth) {
        orientationHint.classList.add('visible');
      } else {
        orientationHint.classList.remove('visible');
      }
    }

    function hideOrientationHint() {
      orientationHint.classList.remove('visible');
    }

    // Dismiss button handler (sole handler — inline onclick removed)
    var dismissBtn = orientationHint.querySelector('.dismiss-btn');
    if (dismissBtn) {
      dismissBtn.addEventListener('click', function () {
        orientationDismissed = true;
        hideOrientationHint();
      });
    }

    function requestLandscape() {
      try {
        if (screen.orientation && screen.orientation.lock) {
          screen.orientation.lock('landscape').catch(function () {
            showOrientationHint();
          });
        } else {
          showOrientationHint();
        }
      } catch (e) {
        showOrientationHint();
      }
    }

    function releaseLandscape() {
      try {
        if (screen.orientation && screen.orientation.unlock) {
          screen.orientation.unlock();
        }
      } catch (e) {
        /* ignore */
      }
      hideOrientationHint();
    }

    window.addEventListener('resize', function () {
      clearTimeout(resizeDebounce);
      resizeDebounce = setTimeout(function () {
        if (isDocCaptureActive) showOrientationHint();
      }, 100);
    });

    // ── Step detection via MutationObserver ──
    var stepObserverDebounce = null;
    var stepObserverAttached = false;
    var stepObserver = new MutationObserver(function () {
      clearTimeout(stepObserverDebounce);
      stepObserverDebounce = setTimeout(function () {
        var host = document.getElementById('kyc-host');
        if (!host) return;
        var blrnApp = host.querySelector('#blrn-app');
        if (!blrnApp) return;

        // Detect document capture step (has camera + document overlay)
        var hasCamera = !!blrnApp.querySelector('video, [class*="camera"]');
        var hasDocOverlay = !!blrnApp.querySelector(
          '.overlay.card, .overlay.passport, [class*="document-overlay"]',
        );
        var isDocCapture = hasCamera && hasDocOverlay;

        if (isDocCapture && !isDocCaptureActive) {
          isDocCaptureActive = true;
          orientationDismissed = false;
          requestLandscape();
        } else if (!isDocCapture && isDocCaptureActive) {
          isDocCaptureActive = false;
          orientationDismissed = false; // Reset for next document step
          releaseLandscape();
        }

        // Detect loading step and try to inject Lottie
        var textContent = blrnApp.textContent || '';
        var isLoadingStep =
          /uploading|checking|almost done/i.test(textContent) &&
          !blrnApp.querySelector('.status-card');
        if (isLoadingStep) {
          tryInjectLottieIntoSDKLoader(blrnApp);
        }
      }, 250);
    });

    function attachStepObserver() {
      if (stepObserverAttached) return;
      var host = document.getElementById('kyc-host');
      if (host) {
        stepObserver.observe(host, { childList: true, subtree: true });
        stepObserverAttached = true;
      }
    }

    // Cleanup on flow completion or page unload
    function cleanupObserversAndAnimations() {
      if (stepObserverAttached) {
        stepObserver.disconnect();
        stepObserverAttached = false;
      }
      clearTimeout(stepObserverDebounce);
      clearTimeout(resizeDebounce);
      destroyLottie();
      releaseLandscape();
    }

    window.addEventListener('pagehide', cleanupObserversAndAnimations);
    window.addEventListener('beforeunload', cleanupObserversAndAnimations);

    attachStepObserver();

    // ── Offline detection ──
    var offlineBanner = document.getElementById('offline-banner');
    window.addEventListener('offline', function () {
      offlineBanner.classList.add('visible');
    });
    window.addEventListener('online', function () {
      offlineBanner.classList.remove('visible');
      if (initFailed) {
        window.location.reload();
      }
    });
  </script>
</body>

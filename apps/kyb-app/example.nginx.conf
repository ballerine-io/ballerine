server {
    listen       80;
    listen  [::]:80;
    server_name  localhost;

    server_tokens off;
    client_max_body_size 20m;

    # ── Compression ──
    gzip on;
    gzip_vary on;
    gzip_types text/html text/css application/javascript application/json image/svg+xml;

    # ── Security headers (all responses) ──
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(self), microphone=(), geolocation=()" always;

    # ── SDK SVG assets (un-hashed) — moderate cache ──
    location /assets/ui-packs/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=86400, stale-while-revalidate=604800";
    }

    # ── Hashed Vite assets — cache aggressively ──
    location /assets/ {
        root   /usr/share/nginx/html;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # ── Mobile KYC (SDK-based) — serve static HTML directly, never fall through to SPA ──
    location /kyc-mobile/ {
        root   /usr/share/nginx/html;
        index  index.html;
        try_files $uri $uri/ /kyc-mobile/index.html;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── Legacy KYC mobile page (rollback option) ──
    # To rollback: change URL rewrite in namk KYC resolvers from /kyc-mobile/ to /kyc-mobile-legacy/
    location /kyc-mobile-legacy/ {
        alias /usr/share/nginx/html/kyc-mobile/;
        try_files /index-legacy.html =404;
        add_header Cache-Control "public, max-age=300, must-revalidate";
    }

    # ── API reverse proxy (defense-in-depth) ──
    # If the MiKashBoks SDK's config.js fails to inject VITE_API_URL, the SDK falls back
    # to the page origin (onboard.*) for API calls. This proxy forwards them to the
    # real workflow-service API instead of returning HTML (GET) or 405 (POST).
    # NOTE: $VITE_API_URL is templated by envsubst in entrypoint.sh at container start.
    location /api/v1/ {
        proxy_pass ${VITE_API_URL}/;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 20m;
        proxy_read_timeout 300s;
    }

    # ── SPA catch-all for collection-flow React app ──
    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        try_files $uri $uri/ /index.html;
        # Entry files (index.html, config.js) should always revalidate
        add_header Cache-Control "no-cache, must-revalidate";
    }

}
